name: Deployer l'app Shiny (shinyapps.io)

# Se lance tout seul quand le dossier app/ change sur main, ou a la main
# (Actions > Deployer l'app Shiny > Run workflow).
# Les donnees (GeoJSON) n'ont PAS besoin de redeploiement : l'app les lit sur GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "R/deployer_app.R"
      - ".github/workflows/deploy-app.yml"

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer les librairies systeme (sf)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev gdal-bin

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Installer les packages de l'app et rsconnect
        run: |
          Rscript -e 'install.packages(c("rsconnect","shiny","leaflet","sf","glue","httr2","jsonlite","digest"))'

      - name: Deployer sur shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APP: phenips
        run: Rscript R/deployer_app.R
