name: Mise a jour des 4 modeles (GeoJSON)

on:
  schedule:
    - cron: "0 5 * * 1"   # tous les lundis a 05h00 UTC
  workflow_dispatch:
    inputs:
      diagnostic_rayonnement:
        description: "Diagnostic seul : statistiques du rayonnement SSI_Q dans le cache, sans modeles ni publication"
        type: boolean
        default: false
      diagnostic_bdforet:
        description: "Diagnostic seul : explore la BD Foret (WFS IGN), ecrit data/diag/, sans modeles"
        type: boolean
        default: false
      construire_masques:
        description: "Construit les masques epicea / pin (BD Foret IGN) dans data/masques/, sans modeles"
        type: boolean
        default: false
      masques:
        description: "Avec construire_masques : liste a reconstruire, separee par des virgules (epicea, pin, chene). Vide = tous"
        type: string
        default: ""
      diagnostic_phenthau:
        description: "Diagnostic seul : teste PHENTHAUproc (chene) sur 2 petites zones SAFRAN, ecrit data/diag/, sans modeles"
        type: boolean
        default: false
      test_phenthau:
        description: "Test PHENTHAU sur 2 petites emprises (Alsace-Vosges, Toulouse), annees 2023-2025 : ecrit data/diag/phenthau_test, sans modeles"
        type: boolean
        default: false
      def_eclosion:
        description: "Avec test_phenthau : definition de l'eclosion, first (la plus precoce des 3 modeles) ou mean (jour moyen). Sortie dans data/diag/phenthau_test_mean si mean"
        type: choice
        options: [first, mean]
        default: first
      test_amont:
        description: "Test du fetch SAFRAN amont national (sept-dec N-1) pour PHENTHAU : ecrit un bilan dans data/diag, sans modeles"
        type: boolean
        default: false
      historique_diag:
        description: "Historique 1960+ : diagnostic GeoSAS (couverture temporelle, debit), ecrit data/diag/"
        type: boolean
        default: false
      historique:
        description: "Historique : nb de generations et 1er envol par maille et par annee (PHENIPS, CHAPY, STENO), ecrit data/historique/"
        type: boolean
        default: false
      annee_debut:
        description: "Historique : premiere annee"
        type: string
        default: "1960"
      annee_fin:
        description: "Historique : derniere annee (annee en cours = partielle, pour validation)"
        type: string
        default: "2025"
      parallele:
        description: "Historique : nombre d'annees calculees en parallele (charge sur GeoSAS)"
        type: string
        default: "5"

permissions:
  contents: write   # commit + push des GeoJSON
  issues: write     # ticket automatique en cas d'echec

# [P15] Un seul run a la fois : un lancement manuel pendant le run du lundi
# attend la fin du premier au lieu de lui faire concurrence au moment du push.
concurrency:
  # Les runs "historique" (longs) ont leur propre file : ils ne bloquent pas le run du lundi.
  group: ${{ (inputs.historique_diag || inputs.historique) && 'maj-historique' || 'maj-modeles' }}
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !inputs.historique_diag && !inputs.historique }}
    # Image figee : "ubuntu-latest" bascule vers Ubuntu 26 (octobre 2026). Les packages R
    # compiles (terra, sf) du cache sont lies aux bibliotheques systeme GDAL/PROJ de
    # l'image qui les a produits ; changer d'image sans changer le cache les casse.
    runs-on: ubuntu-24.04
    timeout-minutes: 180   # 5 modelisations + 1 telechargement partage (~121 requetes SAFRAN) + amont PHENTHAU (cache apres le 1er run)

    env:
      # "true"  : un trou de couverture SAFRAN fait ECHOUER le run (rien n'est publie)
      # "false" : le trou est signale par ::warning:: et le run continue
      SAFRAN_QC_STRICT: "true"

    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessaire pour pull --rebase avant le push

      - name: Installer les librairies systeme (GDAL / GEOS / PROJ / UDUNITS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev gdal-bin

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      # [P10] Versions figees si renv.lock est present (voir R/init_renv.R)
      - name: Installer les packages R (renv.lock)
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      - name: Cache des packages R (sans renv.lock)
        if: hashFiles('renv.lock') == ''
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-ubuntu2404-v3
          restore-keys: |
            r-pkgs-ubuntu2404-

      - name: Installer les packages R (sans renv.lock, versions non figees)
        if: hashFiles('renv.lock') == ''
        run: |
          echo "::warning::renv.lock absent : versions des packages non figees (lancer R/init_renv.R en local)"
          Rscript -e '
            pkgs <- c("barrks","terra","httr2","ggplot2","tidyterra","lubridate",
                      "glue","sf","scales","data.table","dplyr","jsonlite","PHENTHAUproc")
            # requireNamespace() CHARGE vraiment le package (dyn.load) : un binaire en cache
            # lie a des bibliotheques systeme anciennes est detecte et reinstalle.
            ok <- vapply(pkgs, function(p) suppressWarnings(requireNamespace(p, quietly = TRUE)), logical(1))
            if (!all(ok)) {
              cat("A (re)installer :", paste(pkgs[!ok], collapse = ", "), "\n")
              install.packages(pkgs[!ok])
            }
            ok <- vapply(pkgs, function(p) suppressWarnings(requireNamespace(p, quietly = TRUE)), logical(1))
            if (!all(ok)) stop("Packages inutilisables : ", paste(pkgs[!ok], collapse = ", "))
          '

      # [P4] Cle v2 : les anciens CSV (dalles de 50 km, sans marge) ne sont plus
      # reutilises. Les fichiers de cache portent aussi le prefixe safran_v2_.
      - name: Cache SAFRAN (evite de tout retelecharger a chaque run)
        uses: actions/cache@v4
        with:
          path: data/cache_safran
          key: safran-v2-${{ github.run_id }}
          restore-keys: |
            safran-v2-

      - name: Diagnostic du rayonnement SSI_Q (mode diagnostic uniquement)
        if: ${{ inputs.diagnostic_rayonnement }}
        run: Rscript R/diag_rayonnement.R

      - name: Diagnostic BD Foret (mode diagnostic uniquement)
        if: ${{ inputs.diagnostic_bdforet }}
        run: Rscript R/diag_bdforet.R

      - name: Construire les masques d'essence (mode masques uniquement)
        if: ${{ inputs.construire_masques }}
        env:
          MASQUES: ${{ inputs.masques }}
        run: Rscript R/construire_masques.R

      - name: Diagnostic PHENTHAUproc (mode diagnostic uniquement)
        if: ${{ inputs.diagnostic_phenthau }}
        run: Rscript R/diag_phenthau.R

      - name: Test PHENTHAU petite emprise (mode test uniquement)
        if: ${{ inputs.test_phenthau }}
        env:
          PHENTHAU_TEST_EMPRISE: "987929,6754449,1051929,6818449;542008,6247127,606008,6311127"
          PHENTHAU_TEST_ANNEES: "2023,2024,2025"
          PHENTHAU_DEF_ECLOSION: ${{ inputs.def_eclosion }}
          PHENTHAU_DIR_OUT: ${{ inputs.def_eclosion == 'mean' && 'data/diag/phenthau_test_mean' || 'data/diag/phenthau_test' }}
        run: Rscript R/pipeline_phenthau.R

      - name: Test fetch SAFRAN amont national (mode test uniquement)
        if: ${{ inputs.test_amont }}
        run: |
          Rscript R/fetch_safran_amont.R
          Rscript R/diag_phenthau_amont.R

      - name: Publier diagnostic / masques (data/diag, data/masques)
        if: ${{ inputs.diagnostic_bdforet || inputs.construire_masques || inputs.diagnostic_phenthau || inputs.test_phenthau || inputs.test_amont }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/diag data/masques
          if git diff --cached --quiet; then
            echo "Rien a publier"
            exit 0
          fi
          git commit -m "BD Foret : diagnostic / masques $(date -u +%Y-%m-%d)"
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 15
          done
          exit 1

      - name: 1. Recuperation SAFRAN partagee (une seule fois pour les 4 modeles)
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: Rscript R/fetch_safran.R

      - name: 2. PHENIPS (Ips typographus)
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: Rscript R/pipeline_phenips.R

      - name: 3. CHAPY (Pityogenes chalcographus)
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: Rscript R/pipeline_chapy.R

      - name: 4. STENO (Ips sexdentatus)
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: Rscript R/pipeline_steno.R

      - name: 5. Monochamus galloprovincialis (bivoltisme A + B)
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: Rscript R/pipeline_monochamus.R

      # [P15] -A : prend aussi en compte les fichiers SUPPRIMES (purge des anciens
      # fichiers dates). Retry : si un autre commit est arrive entre-temps,
      # on se rebase dessus puis on repousse.
      - name: 6. Publier les GeoJSON (commit unique)
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'data/*.geojson' 'data/*.json'
          if git diff --cached --quiet; then
            echo "Rien de nouveau a publier"
            exit 0
          fi
          git commit -m "MAJ 4 modeles $(date -u +%Y-%m-%d)"
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Echec du push (essai ${essai}/3), nouvel essai dans 15 s"
            sleep 15
          done
          echo "::error::Impossible de publier apres 3 essais"
          exit 1

      # PHENTHAU (chene) : etapes APRES la publication des 4 modeles, en continue-on-error.
      # Un echec ne bloque ni ne retarde les 4 modeles (deja publies) ; il est signale par le ticket.
      - name: 7. SAFRAN amont sept-dec N-1 (PHENTHAU)
        id: phenthau_amont
        continue-on-error: true
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        run: Rscript R/fetch_safran_amont.R

      - name: 8. PHENTHAU (Thaumetopoea processionea, chene)
        id: phenthau
        continue-on-error: true
        if: ${{ !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont && steps.phenthau_amont.outcome == 'success' }}
        run: Rscript R/pipeline_phenthau.R

      - name: 9. Publier PHENTHAU (commit separe)
        if: ${{ steps.phenthau.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'data/phenthau_*.geojson' 'data/phenthau_*.json'
          if git diff --cached --quiet; then
            echo "Rien de nouveau a publier"
            exit 0
          fi
          git commit -m "MAJ PHENTHAU $(date -u +%Y-%m-%d)"
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Echec du push (essai ${essai}/3), nouvel essai dans 15 s"
            sleep 15
          done
          echo "::error::Impossible de publier PHENTHAU apres 3 essais"
          exit 1

      # GeoTIFF (17 bandes de DOY par maille) et PNG nationaux : non commites (comme pour les autres
      # modeles), conserves 30 jours en artefact du run.
      - name: Archiver les GeoTIFF et PNG PHENTHAU (artefact du run)
        if: ${{ !cancelled() && steps.phenthau.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: phenthau-rasters
          path: |
            data/phenthau_*.tif
            data/phenthau_*.png
          retention-days: 30
          if-no-files-found: warn

      # [P15] Notification d'echec : un ticket ouvert (ou commente s'il existe deja)
      - name: Signaler l'echec par un ticket GitHub
        if: ${{ always() && (failure() || steps.phenthau_amont.outcome == 'failure' || steps.phenthau.outcome == 'failure') && !inputs.diagnostic_rayonnement && !inputs.diagnostic_bdforet && !inputs.construire_masques && !inputs.diagnostic_phenthau && !inputs.test_phenthau && !inputs.test_amont }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="Echec de la mise a jour automatique des modeles"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          corps="Le run du $(date -u +%Y-%m-%d) a echoue : ${url}"
          existant=$(gh issue list --state open --search "\"${titre}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "${existant}" ]; then
            gh issue comment "${existant}" --body "${corps}"
          else
            gh issue create --title "${titre}" --body "${corps}"
          fi

  # ===========================================================================
  # HISTORIQUE SAFRAN 1960 -> aujourd'hui (branche historique-1960)
  # ===========================================================================
  historique_diag:
    if: ${{ inputs.historique_diag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environnement R
        uses: ./.github/actions/setup-r-env

      - name: Diagnostic GeoSAS (couverture temporelle, debit)
        run: Rscript R/diag_geosas_histo.R

      - name: Publier le diagnostic (data/diag)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/diag
          if git diff --cached --quiet; then echo "Rien a publier"; exit 0; fi
          git commit -m "Diagnostic GeoSAS historique $(date -u +%Y-%m-%d)"
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 15
          done
          exit 1

  historique_preparer:
    if: ${{ inputs.historique }}
    runs-on: ubuntu-24.04
    outputs:
      annees: ${{ steps.liste.outputs.annees }}
    steps:
      - name: Liste des annees
        id: liste
        env:
          DEBUT: ${{ inputs.annee_debut }}
          FIN: ${{ inputs.annee_fin }}
        run: |
          [[ "$DEBUT" =~ ^[0-9]{4}$ && "$FIN" =~ ^[0-9]{4}$ && "$DEBUT" -le "$FIN" && "$DEBUT" -ge 1959 ]] || { echo "::error::annee_debut / annee_fin invalides (AAAA, debut >= 1959, debut <= fin)"; exit 1; }
          echo "annees=$(seq "$DEBUT" "$FIN" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  historique_annee:
    needs: historique_preparer
    if: ${{ inputs.historique }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallele) }}
      matrix:
        annee: ${{ fromJSON(needs.historique_preparer.outputs.annees) }}
    env:
      ANNEE_SAFRAN: ${{ matrix.annee }}
      SAFRAN_QC_STRICT: "true"
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Environnement R
        uses: ./.github/actions/setup-r-env

      - name: 1. SAFRAN de l'annee (telechargement + controle qualite)
        run: Rscript R/fetch_safran.R

      - name: 2. PHENIPS (2 scenarios)
        run: Rscript R/historique_phenips.R

      - name: 3. CHAPY
        run: Rscript R/historique_chapy.R

      - name: 4. STENO (3 scenarios)
        run: Rscript R/historique_steno.R

      - name: 5. Validation (annee en cours uniquement)
        run: Rscript R/valider_historique.R

      - name: Garder les tables de l'annee
        uses: actions/upload-artifact@v4
        with:
          name: histo-${{ matrix.annee }}
          path: data/historique_tmp/*.csv
          if-no-files-found: error
          retention-days: 7

  historique_assembler:
    needs: historique_annee
    # !cancelled() : l'assemblage tourne meme si une annee a echoue ou depasse son delai (job 'cancelled' par timeout),
    # mais pas si le run entier est annule a la main
    if: ${{ !cancelled() && inputs.historique && needs.historique_annee.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperer les tables annuelles
        uses: actions/download-artifact@v4
        with:
          pattern: histo-*
          merge-multiple: true
          path: data/historique_tmp

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Assembler les tables (data/historique)
        run: Rscript R/assembler_historique.R

      - name: Publier les tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/historique
          if git diff --cached --quiet; then echo "Rien a publier"; exit 0; fi
          git commit -m "Historique SAFRAN : tables annuelles $(date -u +%Y-%m-%d)"
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 15
          done
          exit 1
