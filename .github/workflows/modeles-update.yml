name: Mise a jour des 4 modeles (GeoJSON)

on:
  schedule:
    - cron: "0 5 * * 1"   # tous les lundis a 05h00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # les 4 modelisations + 1 telechargement partage

    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer les librairies systeme (GDAL / GEOS / PROJ / UDUNITS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev gdal-bin

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache des packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-v2
          restore-keys: |
            r-pkgs-${{ runner.os }}-

      - name: Installer les packages R (binaires RSPM)
        run: |
          Rscript -e '
            pkgs <- c("barrks","terra","httr2","ggplot2","tidyterra","lubridate",
                      "glue","sf","scales","data.table","dplyr")
            manquants <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(manquants) > 0) install.packages(manquants)
          '

      - name: Cache SAFRAN (evite de tout retelecharger a chaque run)
        uses: actions/cache@v4
        with:
          path: data/cache_safran
          key: safran-cache-${{ github.run_id }}
          restore-keys: |
            safran-cache-

      - name: 1. Recuperation SAFRAN partagee (une seule fois pour les 4 modeles)
        run: Rscript R/fetch_safran.R

      - name: 2. PHENIPS (Ips typographus)
        run: Rscript R/pipeline_phenips.R

      - name: 3. CHAPY (Pityogenes chalcographus)
        run: Rscript R/pipeline_chapy.R

      - name: 4. STENO (Ips sexdentatus)
        run: Rscript R/pipeline_steno.R

      - name: 5. Monochamus galloprovincialis (bivoltisme A + B)
        run: Rscript R/pipeline_monochamus.R

      - name: 6. Publier les GeoJSON (commit unique)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson
          git diff --cached --quiet && echo "Rien de nouveau a publier" || git commit -m "MAJ 4 modeles $(date -u +%Y-%m-%d)"
          git push
