name: Environnement R (GDAL + packages du projet)
description: Librairies systeme, R 4.4, cache des packages et installation des packages utilises par les pipelines

runs:
  using: composite
  steps:
    - name: Installer les librairies systeme (GDAL / GEOS / PROJ / UDUNITS)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev gdal-bin

    - name: Installer R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.4"
        use-public-rspm: true

    - name: Cache des packages R
      uses: actions/cache@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: r-pkgs-ubuntu2404-v3
        restore-keys: |
          r-pkgs-ubuntu2404-

    - name: Installer les packages R manquants
      shell: bash
      run: |
        Rscript -e '
          pkgs <- c("barrks","terra","httr2","ggplot2","tidyterra","lubridate",
                    "glue","sf","scales","data.table","dplyr","jsonlite")
          ok <- vapply(pkgs, function(p) suppressWarnings(requireNamespace(p, quietly = TRUE)), logical(1))
          if (!all(ok)) { cat("A (re)installer :", paste(pkgs[!ok], collapse = ", "), "\n"); install.packages(pkgs[!ok]) }
          ok <- vapply(pkgs, function(p) suppressWarnings(requireNamespace(p, quietly = TRUE)), logical(1))
          if (!all(ok)) stop("Packages inutilisables : ", paste(pkgs[!ok], collapse = ", "))
        '
